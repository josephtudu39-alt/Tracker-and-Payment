length-clear,pct:slots?Math.round(done/slots*100):0,monthly:M.map((_,i)=>rows.filter(r=>r.m[i]).length)};\n}\nfunction vOverview(){\n const s=stats();\n const byGroup=(key,list)=>list.map(g=>{const rs=rows.filter(r=>r[key]===g);const ok=rs.filter(r=>!missing(r).length).length;return {g,n:rs.length,ok}});\n const grp=(key,list)=>`<div class=\"tw\"><table><thead><tr><th>${key==='by'?'Done by':'Unit category'}<\/th><th class=\"num\">Units<\/th><th class=\"num\">Up to date<\/th><th>Progress<\/th><\/tr><\/thead><tbody>${byGroup(key,list).map(x=>`<tr><td>${esc(x.g)}<\/td><td class=\"num\">${x.n}<\/td><td class=\"num\">${x.ok}<\/td><td><div class=\"prog\"><i style=\"width:${x.n?x.ok/x.n*100:0}%\"><\/i><\/div><\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`;\n const worst=rows.map((r,i)=>[r,s.miss[i]]).filter(x=>x[1].length).sort((a,b)=>b[1].length-a[1].length).slice(0,8);\n const max=Math.max(1,rows.length);\n return `<div class=\"kpis\">\n  <div class=\"kpi\"><b>${rows.filter(r=>!isSub(r)).length}<\/b><span>Units${rows.some(isSub)?' + '+rows.filter(isSub).length+' sub-unit'+(rows.filter(isSub).length>1?'s':''):''}<\/span><\/div>\n  <div class=\"kpi ok\"><b>${s.clear}<\/b><span>Up to date by ${M[target]}<\/span><\/div>\n  <div class=\"kpi bad\"><b>${s.pending}<\/b><span>With missing months<\/span><\/div>\n  <div class=\"kpi\"><b>${s.pct}%<\/b><span>Accounts received<\/span><\/div><\/div>\n <div class=\"grid2\">\n  <section class=\"card\"><h2>Units that submitted, by month<\/h2>\n   <div class=\"bars\" role=\"img\" aria-label=\"Units submitted per month\">${M.map((m,i)=>`<div class=\"bar ${i===target?'cur':''}\"><em>${s.monthly[i]||''}<\/em><i style=\"height:${s.monthly[i]/max*100}%\"><\/i>${m}<\/div>`).join('')}<\/div>\n   <p class=\"note\">Out of ${ucount(rows)}. The gold bar is the month selected above.<\/p><\/section>\n  <section class=\"card\"><h2>Most months outstanding<\/h2><div class=\"tw\"><table><thead><tr><th>Unit<\/th><th>Prepared by<\/th><th class=\"num\">Missing<\/th><\/tr><\/thead><tbody>${worst.map(([r,m])=>`<tr><td>${unm(r)}<\/td><td>${esc(r.prep)}<\/td><td class=\"num\"><span class=\"chip\">${m.length}<\/span><\/td><\/tr>`).join('')||'<tr><td colspan=3 class=\"empty\">Every unit is up to date.<\/td><\/tr>'}<\/tbody><\/table><\/div><\/section>\n  <section class=\"card\"><h2>By person who checks<\/h2>${grp('by',doers)}<\/section>\n  <section class=\"card\"><h2>By unit category<\/h2>${grp('ucat',ucats)}<\/section>\n <\/div>`;\n}\nfunction filteredUnits(){return rows.filter(r=>(!S.q||(r.unit+r.prep+r.tally+r.old).toLowerCase().includes(S.q.toLowerCase()))&&(!S.by||r.by===S.by)&&(!S.ucat||r.ucat===S.ucat)&&(!S.stat||(S.stat==='ok'?!missing(r).length:missing(r).length>0)))}\nfunction vUnits(){\n const f=filteredUnits();\n const nSel=S.sel.size,cf=S.confirm;\n return `<div class=\"filters\">\n  <label class=\"f\" for=\"q\">Search<input type=\"search\" id=\"q\" value=\"${esc(S.q)}\" placeholder=\"Unit, person, tally no.\"><\/label>\n  <label class=\"f\" for=\"fby\">Done by<select id=\"fby\">${opts(doers,S.by,'Everyone')}<\/select><\/label>\n  <label class=\"f\" for=\"fuc\">Unit category<select id=\"fuc\">${opts(ucats,S.ucat,'All')}<\/select><\/label>\n  <label class=\"f\" for=\"fst\">Status<select id=\"fst\"><option value=\"\">All<\/option><option value=\"ok\" ${S.stat==='ok'?'selected':''}>Up to date<\/option><option value=\"miss\" ${S.stat==='miss'?'selected':''}>Missing months<\/option><\/select><\/label>\n  ${canWrite?'<button type=\"button\" class=\"primary\" data-edit=\"\">+ Add unit<\/button><button type=\"button\" data-xl=\"import\">Import Excel<\/button>':''}<button type=\"button\" data-xl=\"export\">Export Excel<\/button>${canWrite?`<button type=\"button\" data-names>Manage names<\/button>${year!==DEF?'':cf&&cf.type==='restore'?'<button type=\"button\" class=\"danger\" data-restore=\"go\">Confirm: replace all with original 62<\/button>':'<button type=\"button\" data-restore=\"ask\">Restore original<\/button>'}`:' mcell\"><button type=\"button\" class=\"mbtn ${on?'on':fut?'future':i<=target?'late':'off'}\" data-r=\"${r.id}\" data-m=\"${i}\" ${canWrite?'':'disabled'} aria-pressed=\"${on}\" aria-label=\"${esc(r.unit)} ${m}\">${on?'✓':'·'}<\/button><\/td>`}).join('')}<td style=\"min-width:150px\">${esc(r.prep)}<\/td><td class=\"mono hide-s\">${esc(r.tally)}${r.old?`<div class=\"note\">old ${esc(r.old)}<\/div>`:''}<\/td><td class=\"hide-s note\">${fmtD(r.upd)}<\/td>${canWrite?`<td class=\"act\" style=\"white-space:nowrap\"><button type=\"button\" class=\"primary ib\" data-edit=\"${r.id}\" title=\"Edit unit\" aria-label=\"Edit unit\">✎<\/button>${hasPar(r)?'':`<button type=\"button\" class=\"ib\" data-sub=\"${r.id}\" title=\"Add a sub-unit under this unit\" aria-label=\"Add sub-unit\">＋<\/button>`}${cf&&cf.type==='row'&&cf.id===r.id?`<button type=\"button\" class=\"danger\" data-del=\"${r.id}\" title=\"Click to confirm delete\">✓ Confirm<\/button>`:`<button type=\"button\" class=\"danger ib\" data-del=\"${r.id}\" title=\"Delete unit\" aria-label=\"Delete unit\">🗑<\/button>`}<\/td>`:''}<\/tr>`).join('')||`<tr><td colspan=\"21\" class=\"empty\">No units match these filters.<\/td><\/tr>`}<\/tbody><\/table><\/div>`;\n}\nfunction reportTable(list,id,withPrep,withPlace){\n const head=['Unit',...(withPrep?['Prepared by']:[]),'Missing months'];\n copyData[id]=tsv(head,list.map(r=>[r.unit,...(withPrep?[r.prep]:[]),missing(r).join(', ')||'All submitted']));\n return `<div class=\"tw\"><table><thead><tr><th>Unit<\/th>${withPrep?'<th>Prepared by<\/th>':''}<th>Missing months<\/th><\/tr><\/thead><tbody>${list.map(r=>`<tr><td>${unm(r)}<\/td>${withPrep?`<td>${esc(r.prep)}<\/td>`:''}<td>${chips(missing(r))}<\/td><\/tr>`).join('')||'<tr><td colspan=3 class=\"empty\">No units found.<\/td><\/tr>'}<\/tbody><\/table><\/div>`;\n}\nfunction vPerson(){\n const l=rows.filter(r=>r.prep===S.person);const n=l.filter(r=>missing(r).length).length;\n return `<div class=\"row-head\"><div class=\"filters\"><label
