<style>
:root{--bg:#f1f4f9;--cd:#fff;--tx:#18222f;--mu:#667386;--bd:#dde3ec;--ac:#2a63c4;--ac2:#14a3b8;--ok:#14804a;--wr:#c27800;--er:#c0372f;--hd:#1d3a6e}

*{box-sizing:border-box}html{background:var(--bg)}

.row .chip{align-self:center}.chip{display:inline-block;background:color-mix(in srgb,var(--er) 14%,transparent);color:var(--er);border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600}
.mo{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:6px}.mo div{flex:1;text-align:center;font-size:10px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}.mo i{display:block;background:linear-gradient(0deg,var(--ac),var(--ac2));border-radius:4px 4px 0 0;min-height:2px}.mo em{font-style:normal;font-size:10px;color:var(--tx)}
.mod{position:sticky;top:0;z-index:6;display:flex;gap:6px;padding:5px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}.mod button{flex:1;min-height:34px;padding:4px 10px;font-weight:600;color:var(--mu);border-radius:20px;white-space:nowrap}.mod button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chs{display:flex;flex-wrap:wrap;gap:4px}.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}

nav button{flex:1;border:0;background:none;font-size:11px;padding:4px 0;min-height:46px;color:var(--mu);border-radius:10px;min-width:0}nav button b{display:block;font-size:18px;font-weight:400}nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
@media(min-width:700px){.g{grid-template-columns:repeat(4,1fr)}.fg{grid-template-columns:repeat(4,1fr)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
#po{display:none}.mdl{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:14px}.mdl>div{background:var(--cd);color:var(--tx);border-radius:14px;padding:16px;max-width:480px;width:100%;display:grid;gap:10px;max-height:92vh;overflow:auto}.mdl input{width:100%}.mdl .err{color:var(--er);font-size:12.5px;min-height:16px}.mdl .bt{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

<header><div><h1>GFS Dashboard</h1><div class="s" id="asof">Loading…</div></div><div class="hb"><button id="rf" title="Refresh">↻</button><button id="st" title="Connect / load data">⚙</button><button class="p" id="pr">🖨 Print</button></div></header>
<div class="mod" id="md"></div>
<div class="bar" id="fb"></div><main id="mn"><div class="em mu">Loading…</div></main>
<div id="po"></div>
<nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),inr=n=>Math.round(Number(n||0)).toLocaleString('en-IN'),dm=d=>d?String(d).split('-').reverse().join('/'):'',pc6=n=>n?String(n).padStart(6,'0'):'';
const MO=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
let TR=null,PD=null;
const S={mod:'rc',tab:'df',mo:'',dmin:'',pm:'',fy:'',upto:0,by:'',ucat:'',prep:'',cat:'',stat:'',q:'',sh:'',per:'fy',d1:'',d2:'',mode:'',bill:'',sort:'dn',pq:'',lim:60,fo:false};
const MODS={rc:{n:'Account Receiving',t:[['rov','▦','Overview'],['mv','📅','Month'],['df','⚠','Defaulters'],['rc','☰','Report']]},pd:{n:'GFS Payment',t:[['pov','▦','Overview'],['py','☰','Payments'],['bl','🧾','Bills'],['pe','👥','Payees'],['ck','✎','Cheques']]}};
const TITLES={rov:'Account Receiving — Overview',mv:'Account Receiving — Month View',df:'Account Receiving — Defaulters',pov:'GFS Payment — Overview',rc:'Account Receiving Report',py:'Payment Report',bl:'Pending Bills',pe:'Payments by Payee & Category',ck:'Cheque Books'};
/* ---------- dates ---------- */
const z2=n=>String(n).padStart(2,'0'),f2=(y,m,d)=>y+'-'+z2(m+1)+'-'+z2(d),tds=()=>{const d=new Date();return f2(d.getFullYear(),d.getMonth(),d.getDate())},fy0=()=>{const t=new Date();return t.getMonth()>=3?t.getFullYear():t.getFullYear()-1};
function range(){const p=S.per,t=new Date(),y=t.getFullYear(),m=t.getMonth();if(p=='all')return['0000-00-00','9999-99-99'];if(p=='m')return[f2(y,m,1),f2(y,m,31)];if(p=='lm'){const d=new Date(y,m-1,1);return[f2(d.getFullYear(),d.getMonth(),1),f2(d.getFullYear(),d.getMonth(),31)]}
if(p=='7'){const d=new Date(t-6*864e5);return[f2(d.getFullYear(),d.getMonth(),d.getDate()),tds()]}if(p=='fy'){const s=fy0();return[s+'-04-01',(s+1)+'-03-31']}if(p=='lfy'){const s=fy0()-1;return[s+'-04-01',(s+1)+'-03-31']}return[S.d1||'0000-00-00',S.d2||'9999-99-99']}
const PERN={m:'This month',lm:'Last month','7':'Last 7 days',fy:'This FY',lfy:'Last FY',all:'All time',c:'Custom'};
/* ---------- data (read from the Google Apps Script sync folder) ---------- */
const CK='gfs-sync-cfg',CC='gfsDashCache3';
const cfg=()=>{try{return JSON.parse(localStorage.getItem(CK))||{}}catch(e){return{}}};
async function api(body){const c=cfg();if(!c.url)throw new Error('Cloud sync is not connected yet.');let j;
 try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:c.key},body)),redirect:'follow'});j=await r.json()}
 catch(e){throw new Error('Cannot reach the sync server. Check the internet connection and the Web app URL.')}
 if(!j.ok)throw new Error(j.error||'Sync failed');return j}
const getJSON=async n=>{const j=await api({action:'get',name:n}),bin=atob(j.b64);return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))))};
const listP=async p=>(await api({action:'list',prefix:p})).files.sort((a,b)=>a.modified-b.modified);
const curFY=()=>{const y=fy0();return y+'-'+String(y+1).slice(2)};
function defT(y){const st=+String(y).slice(0,4),n=new Date(),cur=n.getMonth()>=3?n.getFullYear():n.getFullYear()-1;return st<cur?11:st>cur?0:(n.getMonth()+9)%12}
function mkTR(o){const years=(o.years&&o.years.length?o.years:Object.keys(o.data||{})).slice().sort(),data={};years.forEach(y=>{data[y]=(o.data&&o.data[y])||[]});const year=years.includes(curFY())?curFY():years[years.length-1];return{years,year,def:defT(year),data}}
function mkPD(o){return{led:o.led||[],pay:o.pay||[],sheets:o.sheets||[],acc:o.acc||[]}}
const TOMB={},PTOMB={led:{},pay:{}},CFT={};
function applyTr(o){for(const y in(o.rows||{})){const x=o.rows[y],L=TR.data[y]=TR.data[y]||[],T=TOMB[y]=TOMB[y]||{};if(!TR.years.includes(y)){TR.years.push(y);TR.years.sort()}
  (x.up||[]).forEach(r=>{const i=L.findIndex(q=>q.id===r.id),lt=i<0?0:(L[i]._t||0);if((r._t||0)>Math.max(lt,T[r.id]||0)){if(i<0)L.push(r);else L[i]=r;delete T[r.id]}});
  (x.del||[]).forEach(d=>{const i=L.findIndex(q=>q.id===d.id);if(i>=0){if(d.t>=(L[i]._t||0)){L.splice(i,1);T[d.id]=Math.max(T[d.id]||0,d.t)}}else T[d.id]=Math.max(T[d.id]||0,d.t)});
  L.sort((a,b)=>(a.sl||0)-(b.sl||0))}
 const yv=o.cfg&&o.cfg.years;if(yv&&Array.isArray(yv.v))yv.v.forEach(y=>{if(!TR.years.includes(y)){TR.years.push(y);TR.data[y]=TR.data[y]||[]}});TR.years.sort()}
function applyPd(o){['led','pay'].forEach(c=>{const L=PD[c],T=PTOMB[c],x=o[c]||{};
  (x.up||[]).forEach(r=>{const i=L.findIndex(y=>y.id==r.id),lt=i<0?0:(L[i]._t||0);if((r._t||0)>Math.max(lt,T[r.id]||0)){if(i<0)L.push(r);else L[i]=r;delete T[r.id]}});
  (x.del||[]).forEach(d=>{const i=L.findIndex(y=>y.id==d.id);if(i>=0){if(d.t>(L[i]._t||0)){L.splice(i,1);T[d.id]=Math.max(T[d.id]||0,d.t)}}else T[d.id]=Math.max(T[d.id]||0,d.t)})});
 Object.entries(o.cfg||{}).forEach(([f,x])=>{if((f=='sheets'||f=='acc')&&x&&x.t>(CFT[f]||0)){PD[f]=x.v;CFT[f]=x.t}})}
async function pool(L,n,fn){const out=[];let i=0;await Promise.all(Array.from({length:Math.min(n,L.length)},async()=>{while(i<L.length){const k=i++;out[k]=await fn(L[k])}}));return out}
async function loadCloud(){
 const[la,lc,lp,lq]=await Promise.all([listP('ARS_backup_'),listP('ARS_chg_'),listP('GFS_Payment_Desk_backup_'),listP('GFS_chg_')]);
 let msg=[];
 if(la.length){const bf=la[la.length-1],o=await getJSON(bf.name),sv=(o.saved?Date.parse(o.saved):bf.modified)-120000;TR=mkTR(o);Object.keys(TOMB).forEach(k=>delete TOMB[k]);
  const ch=lc.filter(f=>f.modified>=sv).slice(-60),os=(await pool(ch,5,f=>getJSON(f.name).catch(()=>null))).filter(x=>x&&x.app==='ARS'&&x.kind==='chg').sort((a,b)=>(a.t||0)-(b.t||0));os.forEach(applyTr);msg.push('receiving ✓')}
 if(lp.length){const bf=lp[lp.length-1],o=await getJSON(bf.name),sv=(o.saved?Date.parse(o.saved):bf.modified)-120000;PD=mkPD(o);PTOMB.led={};PTOMB.pay={};
  const ch=lq.filter(f=>f.modified>=sv).slice(-60),os=(await pool(ch,5,f=>getJSON(f.name).catch(()=>null))).filter(x=>x&&x.kind==='chg').sort((a,b)=>(a.t||0)-(b.t||0));os.forEach(applyPd);msg.push('payments ✓')}
 if(!TR&&!PD)throw new Error('No backup files found in the sync folder yet. Open the Payment Desk / Tracker app once with sync connected, wait a minute, then refresh.');
 pdClean();return msg.join(' · ')}
let hid=0;function pdClean(){hid=0;if(!PD||!PD.sheets||!PD.sheets.length)return;const ok=new Set(PD.sheets.map(s=>s.k)),n=PD.led.length;PD.led=PD.led.filter(r=>!r.sh||ok.has(r.sh));hid=n-PD.led.length}
function ready(){return !!(TR||PD)}
function init(){if(TR&&(!S.fy||!TR.years.includes(S.fy))){S.fy=TR.year;S.upto=TR.def}}
function saveCache(){try{localStorage.setItem(CC,JSON.stringify({TR,PD,t:Date.now()}))}catch(e){try{localStorage.removeItem(CC)}catch(x){}}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CC)||'null');if(c&&(c.TR||c.PD)){TR=c.TR;PD=c.PD;pdClean();return c.t}}catch(e){}return 0}
let loading=false,loadedAt=0,lastErr='';
function head(){const n=a=>a?a.length:0;$('#asof').textContent=(loadedAt?'Updated '+new Date(loadedAt).toLocaleString([],{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'Not loaded')+' · '+(TR?(TR.data[S.fy]||[]).length+' units':'no receiving data')+' · '+(PD?PD.led.length+' payments'+(hid?' ('+hid+' from removed bank accounts hidden)':''):'no payment data')+(lastErr?' · ⚠ '+lastErr:'')}
function refreshUI(){init();head();if(!document.activeElement||!$('#fb').contains(document.activeElement))rbar();rc_()}
async function load(manual){if(loading)return;if(!cfg().url){if(!ready())openSet('Connect to your sync folder to see the reports.');return}
 loading=true;$('#rf').textContent='…';
 try{const m=await loadCloud();loadedAt=Date.now();lastErr='';saveCache()}catch(e){lastErr=e.message||String(e);if(manual||!ready())openSet(lastErr)}
 finally{loading=false;$('#rf').textContent='↻';refreshUI()}}
/* ---------- connect / load-file dialog ---------- */
function openSet(note){const old=$('#mdl');if(old)old.remove();const c=cfg(),d=document.createElement('div');d.className='mdl';d.id='mdl';
 d.innerHTML=`<div><b style="font-size:17px">Connect dashboard</b><div class="m">Paste the <b>Web app URL</b> and <b>sync key</b> of your GFS Apps Script (the same two values the apps use). The dashboard only reads data; it never changes it.</div><input id="mu" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(c.url||'')}"><input id="mk" type="password" placeholder="Sync key" value="${esc(c.key||'')}"><div class="err" id="me">${esc(note||'')}</div><div class="bt"><button id="mf">Load a backup file…</button><button id="mc">Close</button><button class="p" id="mo">Connect &amp; load</button></div><input type="file" id="mfile" accept=".json,application/json" hidden></div>`;
 document.body.appendChild(d);
 $('#mc').onclick=()=>d.remove();
 $('#mo').onclick=async()=>{const url=$('#mu').value.trim(),key=$('#mk').value.trim(),E=$('#me');if(!/^https:\/\/script\.google\.com\//.test(url)){E.textContent='The URL must start with https://script.google.com/ and end with /exec';return}if(!key){E.textContent='Enter the sync key';return}
